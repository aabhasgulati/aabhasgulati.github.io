project:
  type: website
  output-dir: docs

website:
  title: "Aabhas Gulati"
  site-url: "https://aabhasgulati.github.io"
  description: "Aabhas Gulati is a PhD student at Institut de Mathématiques de Toulouse working on quantum information theory: entanglement, symmetry in quantum states, and polynomial optimization."
  open-graph:
    image: profile.webp
  twitter-card:
    card-style: summary
    image: profile.webp
  page-navigation: false
  search: false
  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - research.qmd
      - talks.qmd
      - href: AabhasGulati_CV.pdf
        text: CV
      - href: blog.qmd
        text: Musings
  page-footer:
    center: "© 2026 Aabhas Gulati"

format:
  html:
    theme:
      light: default
      dark: [default, dark.scss]
    css: styles.css
    toc: false
    smooth-scroll: true
    respect-user-color-scheme: true
    html-math-method: mathjax
